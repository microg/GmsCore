apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

android {
    namespace "com.google.mlkit.vision.documentscanner"

    compileSdkVersion androidCompileSdk
    buildToolsVersion "$androidBuildVersionTools"

    buildFeatures {
        aidl = true
    }

    defaultConfig {
        versionName version
        minSdkVersion androidMinSdk
        targetSdkVersion androidTargetSdk
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
}

apply from: '../../gradle/publish-android.gradle'

description = 'microG implementation of play-services-mlkit-document-scanner'

dependencies {
    // Dependencies from play-services-mlkit-document-scanner:16.0.0
    api 'androidx.activity:activity:1.3.1'
    //api "com.google.android.datatransport:transport-api:2.2.1"
    //api "com.google.android.datatransport:transport-backend-cct:2.3.3"
    //api "com.google.android.datatransport:transport-runtime:2.2.6"
    api project(':play-services-base')
    api project(':play-services-basement')
    api project(':play-services-tasks')
    //api "com.google.firebase:firebase-components:16.1.0"
    //api "com.google.firebase:firebase-encoders:16.1.0"
    //api "com.google.firebase:firebase-encoders-json:17.1.0"
    //api "com.google.mlkit:common:18.11.0"

    // Dependencies from "com.google.mlkit:common:18.11.0"
    api 'androidx.appcompat:appcompat:1.6.1'

    annotationProcessor project(":safe-parcel-processor")
}
