apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

dependencies {
    implementation project(':play-services-base-core')
    implementation project(':play-services-mlkit-text-recognition-common')
    implementation project(':play-services-vision-core')

    implementation 'com.huawei.hms:ml-computer-vision-ocr:3.17.11.304'
}

android {
    namespace 'org.microg.gms.vision.hms'

    compileSdkVersion androidCompileSdk
    buildToolsVersion "$androidBuildVersionTools"

    defaultConfig {
        minSdkVersion androidMinSdk
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    kotlinOptions {
        jvmTarget = 1.8
    }
}
