apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: 'com.squareup.wire'

dependencies {
    implementation project(':play-services-base-core')

    implementation project(':play-services-location')
    implementation project(':play-services-wearable')
    implementation "com.squareup.wire:wire-runtime:$wireVersion"
    testImplementation 'junit:junit:4.13.2'
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-${androidCompileSdk}/optional/android.test.base.jar",
            "${android.sdkDirectory}/platforms/android-${androidCompileSdk}/optional/android.test.runner.jar",
            "${android.sdkDirectory}/platforms/android-${androidCompileSdk}/optional/android.test.mock.jar")
}

android {
    namespace "org.microg.gms.wearable.core"

    compileSdkVersion androidCompileSdk
    buildToolsVersion "$androidBuildVersionTools"

    defaultConfig {
        versionName version
        minSdkVersion androidMinSdk
        targetSdkVersion androidTargetSdk
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildFeatures {
        dataBinding = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'MissingTranslation'
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    kotlinOptions {
        jvmTarget = 1.8
    }
}

androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.androidTest?.enableMultiDex = true
    }
}

wire {
    java {
    }
}

apply from: '../../gradle/publish-android.gradle'

description = 'microG service implementation for play-services-wearable'
