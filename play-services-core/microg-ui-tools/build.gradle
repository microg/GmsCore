apply plugin: 'com.android.library'

android {
    namespace "org.microg.tools.ui"

    compileSdkVersion androidCompileSdk
    buildToolsVersion "$androidBuildVersionTools"

    defaultConfig {
        versionName version
        minSdkVersion androidMinSdk
        targetSdkVersion androidTargetSdk

        buildConfigField "String", "APP_VERSION_NAME", "\"${rootProject.version}\""
        def gvc = rootProject.ext.appVersionCode.toString()
        def baseVersion = gvc[0..1] + '.' + gvc[2..3] + '.' + gvc[4..5]
        buildConfigField "String", "GMS_VERSION_NAME", "\"GMS: ${baseVersion}\""
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    buildFeatures {
        buildConfig = true
    }

    lintOptions {
        // TODO: Remove MissingTranslation once we have stable strings and proper translations.
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "androidx.preference:preference:$preferenceVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation "com.squareup.okhttp3:okhttp:$okHttpVersion"
}

