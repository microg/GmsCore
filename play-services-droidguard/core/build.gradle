apply plugin: 'com.android.library'
apply plugin: 'com.squareup.wire'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'
apply plugin: 'signing'

// Android unit-test compilation needs the HTTP server API outside android.jar.
// Keep generated JDK API classes compile-only; the unit-test JVM uses its module.
def httpServerTestModule = new File(System.getProperty('java.home'), 'jmods/jdk.httpserver.jmod')
def httpServerTestTool = new File(System.getProperty('java.home'),
        'bin/jmod' + (System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''))
def httpServerTestModuleDir = layout.buildDirectory.dir('jdk-httpserver-test/module')
def httpServerTestApiDir = layout.buildDirectory.dir('jdk-httpserver-test/api')

def extractHttpServerTestModule = tasks.register('extractHttpServerTestModule', Exec) {
    inputs.file(httpServerTestModule)
    outputs.dir(httpServerTestModuleDir)
    commandLine httpServerTestTool.absolutePath, 'extract', '--dir',
            httpServerTestModuleDir.get().asFile.absolutePath, httpServerTestModule.absolutePath
    doFirst {
        if (!httpServerTestTool.isFile() || !httpServerTestModule.isFile()) {
            throw new GradleException('DroidGuard unit tests require a full JDK with jdk.httpserver')
        }
    }
}

def prepareHttpServerTestApi = tasks.register('prepareHttpServerTestApi', Sync) {
    dependsOn extractHttpServerTestModule
    from(httpServerTestModuleDir.map { it.dir('classes') }) {
        include 'com/sun/net/httpserver/**/*.class'
    }
    into(httpServerTestApiDir)
}

def packageHttpServerTestApi = tasks.register('packageHttpServerTestApi', Jar) {
    dependsOn prepareHttpServerTestApi
    from(httpServerTestApiDir)
    archiveFileName = 'jdk-httpserver-test-api.jar'
    destinationDirectory = layout.buildDirectory.dir('jdk-httpserver-test')
}

dependencies {
    api project(':play-services-droidguard')

    implementation project(':play-services-base-core')
    implementation project(':play-services-chimera-core')
    implementation project(':play-services-tasks-ktx')

    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "androidx.core:core-ktx:$coreVersion"
    implementation "androidx.preference:preference-ktx:$preferenceVersion"

    implementation "com.android.volley:volley:$volleyVersion"
    implementation "com.squareup.wire:wire-runtime:$wireVersion"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"

    testCompileOnly files(packageHttpServerTestApi.flatMap { it.archiveFile }).builtBy(packageHttpServerTestApi)
    testImplementation "junit:junit:4.13.2"
}

wire {
    kotlin {}
}

android {
    namespace "org.microg.gms.droidguard.core"

    compileSdkVersion androidCompileSdk
    buildToolsVersion "$androidBuildVersionTools"

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        versionName "20.47.14"
        versionCode 204714000
        minSdkVersion androidMinSdk
        targetSdkVersion androidTargetSdk
        buildConfigField("String", "VERSION_NAME", "\"${defaultConfig.versionName}\"")
        buildConfigField("int", "VERSION_CODE", "${defaultConfig.versionCode}")
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'MissingTranslation', 'GetLocales'
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    testOptions {
        unitTests.all {
            jvmArgs '--add-modules=jdk.httpserver'
        }
    }

    kotlinOptions {
        jvmTarget = 1.8
    }
}

apply from: '../../gradle/publish-android.gradle'

description = 'microG service implementation for play-services-droidguard'
