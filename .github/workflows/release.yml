name: Release
on:
  workflow_dispatch:

jobs:
  build:
    name: "Release build"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Setup Java"
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
      - name: "Execute Gradle build"
        run: "./gradlew --no-daemon :play-services-core:assembleVtmDefaultRelease"

      - name: "Compute version"
        id: version
        run: |
          APK=$(ls play-services-core/build/outputs/apk/vtmDefault/release/*.apk | head -1)
          VER=$("$ANDROID_HOME"/build-tools/35.0.0/aapt dump badging "$APK" | grep -oP "versionName='\\K[^']+")
          # Version may carry a "-N (commit)" suffix; GitHub tags can't contain spaces/parens.
          # Use the full version for the release name but a tag-safe form for the tag.
          SAFE=$(echo "$VER" | sed -E 's/ \(.*\)//')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - uses: ilharp/sign-android-release@v2
        name: "Sign app APK"
        id: sign_app
        with:
          releaseDir: play-services-core/build/outputs/apk/vtmDefault/release
          signingKey: ${{ secrets.KEYSTORE_B64 }}
          keyAlias: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          buildToolsVersion: 35.0.0

#      - name: "Create release"
#        uses: softprops/action-gh-release@v2
#        with:
#          tag_name: v${{ steps.version.outputs.tag }}
#          name: v${{ steps.version.outputs.version }}
#          files: ${{ steps.sign_app.outputs.signedFile }}
#          generate_release_notes: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE
          archive: false
          path: ${{steps.sign_app.outputs.signedFile}}
