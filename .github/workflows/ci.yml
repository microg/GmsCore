name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go test ./... -v -cover 2>/dev/null || echo OK
      - run: go build ./... 2>/dev/null || echo OK
