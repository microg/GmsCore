name: WearOS CI

on:
  push:
    branches: [master, main]
    paths:
      - 'play-services-wearable/**'
  pull_request:
    paths:
      - 'play-services-wearable/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gradle-task: [assembleDebug, assembleRelease, testDebug, testRelease]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: ${{ matrix.gradle-task }}
        run: ./gradlew :play-services-wearable:core:${{ matrix.gradle-task }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew :play-services-wearable:core:lint

  android-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [26, 30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          script: ./gradlew :play-services-wearable:core:connectedCheck
