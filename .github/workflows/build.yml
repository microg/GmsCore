name: "Gradle build"
permissions: {}
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Gradle build ${{ matrix.target }}"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    strategy:
      matrix:
        target: [Release]

    steps:
      - name: "Free disk space"
        run: |
          # Deleting unneeded software packages
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go

          # Log available space
          df -h
      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
      - name: "Setup matchers"
        run: |
          # Setting up matchers...

          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done
      - name: "Execute Gradle assemble"
        env:
            SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
            SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
            SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE }}" | base64 -d > keystore.jks
          ./gradlew assemble${{ matrix.target }}  \
          -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
          -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"

          for APK in $(find . -type f -name "*.apk"); do
            echo "Signing $APK with V1/V2/V3/V4"
            "$APKSIGNER" sign \
              --ks keystore.jks \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
              --key-pass "pass:$SIGNING_KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$APK"
          done

          for APK in $(find . -type f -name "*.apk"); do
            echo "Verifying $APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done
          
      - name: "Execute Gradle lint"
        run: "./gradlew lint${{ matrix.target }}"
      - name: "Upload APK artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: microg-apks-${{ matrix.target }}
          path: "play-services-core/build/outputs/apk/*/*/*.apk"
          if-no-files-found: error
